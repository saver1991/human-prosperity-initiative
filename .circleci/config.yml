version: 2.1
jobs:
  website-quality:
    docker:
      - image: cimg/node:22.11
    resource_class: small
    steps:
      - run:
          name: Fetch exact public GitHub commit over HTTPS
          command: |
            set -euo pipefail
            test -n "$CIRCLE_SHA1"
            git init -q
            git remote add origin https://github.com/saver1991/human-prosperity-initiative.git
            git fetch -q --depth=1 origin "$CIRCLE_SHA1"
            git checkout -q --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
      - run:
          name: Build and test HPI website
          command: npm run check
      - store_artifacts:
          path: dist
          destination: public-site
workflows:
  check:
    jobs:
      - website-quality
# CircleCI public repo HTTPS checkout avoids absent SSH deploy keys.
# CI tests have no secrets and do not deploy; Vercel handles Git-linked deployments.
